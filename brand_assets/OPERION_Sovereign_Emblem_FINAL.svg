<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" role="img">
  <title>OPERION — Sovereign Emblem (FINAL)</title>
  <desc>OPERION sovereign mark: titanium hex, deep cobalt Ion core with contained cold-light emanation. Obsidian matte field. Production asset — do not modify.</desc>

  <defs>

    
    <filter id="grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="4" stitchTiles="stitch" result="noise"></feTurbulence>
      <feColorMatrix type="saturate" values="0" in="noise"></feColorMatrix>
    </filter>

    
    <filter id="shadowBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"></feGaussianBlur>
    </filter>

    
    <linearGradient id="titaniumGrad" x1="73" y1="70" x2="247" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#383848"></stop>
      <stop offset="11%" stop-color="#888898"></stop>
      <stop offset="22%" stop-color="#C4C4D8"></stop>
      <stop offset="32%" stop-color="#E8E8F6"></stop>
      <stop offset="41%" stop-color="#F8F8FF"></stop>
      <stop offset="48%" stop-color="#FFFFFF"></stop>
      <stop offset="58%" stop-color="#E2E2F0"></stop>
      <stop offset="72%" stop-color="#A8A8C0"></stop>
      <stop offset="86%" stop-color="#686878"></stop>
      <stop offset="100%" stop-color="#2C2C3C"></stop>
    </linearGradient>

    
    <radialGradient id="coreGrad" cx="151" cy="160" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2244"></stop>
      <stop offset="28%" stop-color="#121830"></stop>
      <stop offset="60%" stop-color="#0C101E"></stop>
      <stop offset="100%" stop-color="#050710"></stop>
    </radialGradient>

    
    <radialGradient id="coreCatch" cx="147" cy="156" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5870B8" stop-opacity="0.60"></stop>
      <stop offset="45%" stop-color="#2C3C80" stop-opacity="0.20"></stop>
      <stop offset="100%" stop-color="#101828" stop-opacity="0"></stop>
    </radialGradient>

    
    <filter id="glowOuter" x="-120%" y="-120%" width="340%" height="340%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="15" result="blur"></feGaussianBlur>
      <feColorMatrix type="matrix" values="0.85 0   0   0 0.05&#xA;                0    0.9 0   0 0.06&#xA;                0    0   1   0 0.08&#xA;                0    0   0   1 0" in="blur"></feColorMatrix>
    </filter>

    <filter id="glowRim" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"></feGaussianBlur>
    </filter>

    
    <filter id="metalBevel" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="bumpMap"></feGaussianBlur>
      <feSpecularLighting in="bumpMap" surfaceScale="5" specularConstant="1.9" specularExponent="42" lighting-color="#FFFFFF" result="specularOut">
        <fePointLight x="68" y="32" z="140"></fePointLight>
      </feSpecularLighting>
      <feComposite in="specularOut" in2="SourceAlpha" operator="in" result="specularClipped"></feComposite>
      <feBlend in="SourceGraphic" in2="specularClipped" mode="screen"></feBlend>
    </filter>

    
    <linearGradient id="wordmarkGrad" x1="55" y1="334" x2="265" y2="334" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#505060"></stop>
      <stop offset="25%" stop-color="#A8A8B8"></stop>
      <stop offset="47%" stop-color="#D4D4E0"></stop>
      <stop offset="62%" stop-color="#B0B0C0"></stop>
      <stop offset="100%" stop-color="#484858"></stop>
    </linearGradient>

  </defs>


  
  
  


  

  
  <polygon points="246.6,120 160,70 73.4,120 73.4,220 160,270 246.6,220" fill="none" stroke="#000000" stroke-width="10" stroke-linejoin="miter" transform="translate(2.5, 2.5)" opacity="0.55" filter="url(#shadowBlur)"></polygon>

  
  <polygon points="246.6,120 160,70 73.4,120 73.4,220 160,270 246.6,220" fill="none" stroke="url(#titaniumGrad)" stroke-width="3" stroke-linejoin="miter" filter="url(#metalBevel)"></polygon>

  
  <path d="M73.4,120 L160,70 L246.6,120" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="miter" opacity="0.28"></path>


  

  
  <circle cx="160" cy="170" r="40" fill="#B8E2F4" opacity="0.17" filter="url(#glowOuter)"></circle>

  
  <circle cx="160" cy="170" r="34" fill="none" stroke="#D4EEFA" stroke-width="3" opacity="0.22" filter="url(#glowRim)"></circle>

  
  <circle cx="160" cy="170" r="34" fill="url(#coreGrad)"></circle>

  
  <circle cx="160" cy="170" r="34" fill="url(#coreCatch)"></circle>

  
  <circle cx="160" cy="170" r="34" fill="none" stroke="url(#titaniumGrad)" stroke-width="2.5" filter="url(#metalBevel)"></circle>


  

  
  <line x1="189.4" y1="153.0" x2="224.9" y2="132.5" stroke="url(#titaniumGrad)" stroke-width="1.5" stroke-linecap="square"></line>
  
  <line x1="160.0" y1="136.0" x2="160.0" y2="95.0" stroke="url(#titaniumGrad)" stroke-width="1.5" stroke-linecap="square"></line>
  
  <line x1="130.6" y1="153.0" x2="95.1" y2="132.5" stroke="url(#titaniumGrad)" stroke-width="1.5" stroke-linecap="square"></line>
  
  <line x1="130.6" y1="187.0" x2="95.1" y2="207.5" stroke="url(#titaniumGrad)" stroke-width="1.5" stroke-linecap="square"></line>
  
  <line x1="160.0" y1="204.0" x2="160.0" y2="245.0" stroke="url(#titaniumGrad)" stroke-width="1.5" stroke-linecap="square"></line>
  
  <line x1="189.4" y1="187.0" x2="224.9" y2="207.5" stroke="url(#titaniumGrad)" stroke-width="1.5" stroke-linecap="square"></line>


  
  <line x1="112" y1="300" x2="208" y2="300" stroke="#282838" stroke-width="0.75"></line>


  
  <text x="151" y="334" font-family="&#39;Helvetica Neue&#39;, &#39;Arial&#39;, sans-serif" font-weight="200" font-size="21" letter-spacing="18" fill="url(#wordmarkGrad)" dominant-baseline="middle" text-anchor="middle">OPERION</text>

</svg>